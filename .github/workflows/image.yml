name: image

# Builds the self-host image natively on amd64 and arm64, gates on the compose smoke test (amd64; arm64 was
# proven on the Mac), and publishes a multi-arch manifest to GHCR: `edge` + `sha-<short>` per master push.
# A `web-X.Y.Z` tag retags that commit's already-built manifest as `X.Y.Z` + `latest` (no rebuild).
#
# Build and smoke run with read-only permissions; only the push, manifest and release jobs hold packages: write.

on:
  push:
    branches: [master]
    tags: ['web-*']
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/stefanskotte/webadf

jobs:
  guard:
    # A manual run from another branch must say so, not skip everything green.
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "::error::The image workflow publishes from master only; this run is on $GITHUB_REF. Dispatch it on master."
          exit 1

  build:
    if: github.ref == 'refs/heads/master'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          # Classic `docker build` (no buildx builder) so the image lands in the daemon for the smoke and `docker save`.
          # The in-image `next build` downloads Google Fonts; one transient failure has been seen, so retry once.
          # GIT_SHA is the full commit (Settings' About section links it); the registry tag uses the 7-char short form.
          for attempt in 1 2; do
            docker build -f docker/Dockerfile --build-arg GIT_SHA="$GITHUB_SHA" -t webadf:smoke . && exit 0
            echo "docker build failed (attempt $attempt)" >&2
          done
          exit 1
      - name: smoke
        if: matrix.arch == 'amd64'
        run: WEBADF_SMOKE_IMAGE=webadf:smoke bash scripts/docker-smoke.sh
      - name: save image
        run: docker save webadf:smoke | gzip -1 > "$RUNNER_TEMP/image.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image.tar.gz
          retention-days: 1
          compression-level: 0

  push:
    needs: build
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push arch image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          gunzip -c "$RUNNER_TEMP/image.tar.gz" | docker load
          T="$IMAGE:sha-${GITHUB_SHA::7}-$ARCH"
          docker tag webadf:smoke "$T"
          docker push "$T"

  manifest:
    needs: push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    # Serialise manifest jobs so two quick master pushes cannot interleave; a run waiting behind another
    # is never cancelled by this setting (GitHub still replaces an older *pending* run with a newer one).
    concurrency:
      group: image-manifest
      cancel-in-progress: false
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: multi-arch manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          S="sha-${GITHUB_SHA::7}"
          tags=(-t "$IMAGE:$S")
          # `edge` only moves forward: skip it when a newer master commit exists (re-runs, quick successive pushes).
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            tags+=(-t "$IMAGE:edge")
          else
            echo "master has moved on ($head); pushing $S only, leaving edge alone"
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE:$S-amd64" "$IMAGE:$S-arm64"
          docker buildx imagetools inspect "$IMAGE:$S"

  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    concurrency:
      group: image-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: retag the commit's image
        env:
          TAG: ${{ github.ref_name }}
        run: |
          V="${TAG#web-}"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $TAG is not web-X.Y.Z"
            exit 1
          fi
          S="sha-${GITHUB_SHA::7}"
          # A tag pushed together with its commit races the master build: wait up to 30 minutes for the manifest.
          found=""
          for i in $(seq 1 60); do
            if out=$(docker buildx imagetools inspect "$IMAGE:$S" 2>&1); then found=1; break; fi
            if grep -qiE 'not found|manifest unknown|no such manifest' <<<"$out"; then
              echo "attempt $i/60: $IMAGE:$S not published yet"
            else
              echo "attempt $i/60: could not query the registry (auth or network, not a missing image): $out"
            fi
            sleep 30
          done
          if [ -z "$found" ]; then
            echo "::error::no image $IMAGE:$S for the tagged commit $GITHUB_SHA after 30 minutes -- build master first (the image workflow must finish for this commit, then re-run this job). Last registry answer: $out"
            exit 1
          fi
          docker buildx imagetools create -t "$IMAGE:$V" -t "$IMAGE:latest" "$IMAGE:$S"
          docker buildx imagetools inspect "$IMAGE:$V"
