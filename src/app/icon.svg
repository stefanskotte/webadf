    this, and there does not need to be for three shapes.
  -->
  <path d="M12 5 H43.5 L59 20.5 V52 A7 7 0 0 1 52 59 H12 A7 7 0 0 1 5 52 V12 A7 7 0 0 1 12 5 Z"
        fill="#16232f" stroke="#c8cfd3" stroke-width="7" stroke-linejoin="round" paint-order="stroke"/>
  <path d="M22 5 H41 V23 H22 Z" fill="#f5822e"/>
  <rect x="14" y="33" width="36" height="20" rx="3.5" fill="#c8cfd3"/>
