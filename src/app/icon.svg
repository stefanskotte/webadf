<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    The webadf mark, small-size variant: the slot and the label's ruled lines
    are removed and the keyline goes to 7, because a sub-pixel outline is the
